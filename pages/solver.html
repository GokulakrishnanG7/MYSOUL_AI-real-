<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Problem Solver — MySoul AI</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../modules/soul-os.css"/>
<style>
.page-input-section{padding:0 20px 20px}
.result-section{padding:0 20px 20px;display:none;animation:os-fade-up .5s ease}
.result-section.show{display:block}
.result-card{padding:20px;border-radius:18px;background:rgba(56,240,152,.06);border:1px solid rgba(56,240,152,.2);margin-bottom:16px}
.result-title{font-family:var(--f-display);font-size:13px;letter-spacing:.1em;color:rgb(56,240,152);margin-bottom:10px}
.result-body{font-size:14px;color:var(--text-1);line-height:1.75}
.steps-list{counter-reset:steps}
.step-item{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start}
.step-num{width:28px;height:28px;border-radius:50%;background:rgba(56,240,152,.15);border:1px solid rgba(56,240,152,.4);color:rgb(56,240,152);font-family:var(--f-display);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step-text{font-size:14px;color:var(--text-1);line-height:1.6;padding-top:4px}
</style>
</head>
<body>
<div class="os-bg"></div>
<canvas class="os-bg-canvas" id="bgCanvas"></canvas>
<div class="os-page">
  <div class="os-page-header">
    <div>
      <div class="os-page-title">🧮 Problem Solver</div>
      <div class="os-page-subtitle">AI-powered guidance</div>
    </div>
    <a href="launcher.html" class="os-back-btn">⬡</a>
  </div>
  <div class="page-input-section">
    <textarea class="os-input os-textarea" id="pageInput" placeholder="Paste your math or coding problem here…&#10;e.g. 'Solve x² + 5x + 6 = 0' or paste code to debug" style="min-height:110px;line-height:1.6"></textarea>
    <div style="display:flex;gap:10px;margin-top:12px">
      <button class="os-btn os-btn-solid" id="pageSubmit" style="flex:1">🧮 Get Guidance</button>
      <button class="os-btn os-btn-icon" id="pageVoice">◎</button>
    </div>
  </div>
  <div class="result-section" id="resultSection">
    <div class="result-card">
      <div class="result-title">◈ Soul Guidance</div>
      <div class="result-body" id="resultBody"></div>
    </div>
  </div>
</div>
<nav class="os-nav" id="osNav"></nav>
<script src="../modules/auto-voice-trigger.js"></script>
<script src="../modules/soul-features.js"></script>
<script src="../modules/page-shell.js"></script>
<script>
buildNav('');buildParticles('bgCanvas','60','56,240,152');
async function submit(){
  const t=document.getElementById('pageInput').value.trim();
  if(!t){showToast('Please enter something','error');return;}
  const section=document.getElementById('resultSection');
  const body=document.getElementById('resultBody');
  section.classList.add('show');
  setLoading(body,true,'Generating guidance…');
  const res=await soulAPI(t,'PROBLEM_SOLVER_STEPBYSTEP');
  body.innerHTML=formatResponse(res.response||'I\'m here to help. Please try again in a moment.');
}
document.getElementById('pageSubmit').addEventListener('click',submit);
document.getElementById('pageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.ctrlKey)submit();});
document.getElementById('pageVoice').addEventListener('click',()=>{
  VoiceSystem.show();
  VoiceSystem.onTranscript(t=>{document.getElementById('pageInput').value=t;VoiceSystem.hide();submit();});
});
</script>
</body>
</html>
